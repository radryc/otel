receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 32
      http:
        endpoint: 0.0.0.0:4318
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 15s
  syslog/docker:
    tcp:
      listen_address: 0.0.0.0:1514
    protocol: rfc5424

processors:
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 1000
    policies:
      - name: keep-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: keep-slow-traces
        type: latency
        latency:
          threshold_ms: 1000
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
  transform/docker_logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(resource.attributes["service.name"], attributes["appname"]) where attributes["appname"] != nil
          - set(resource.attributes["container.name"], attributes["appname"]) where attributes["appname"] != nil
  resource/docker_metrics:
    attributes:
      - key: service.name
        from_attribute: container.name
        action: upsert
  batch: {}

exporters:
  otlp_grpc/doctor:
    endpoint: ${env:DOCTOR_OTLP_ENDPOINT}
    compression: none
    tls:
      insecure: true
    headers:
      x-doctor-tenant: ${env:DOCTOR_TENANT}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling, batch]
      exporters: [otlp_grpc/doctor]
    logs:
      receivers: [otlp, syslog/docker]
      processors: [transform/docker_logs, batch]
      exporters: [otlp_grpc/doctor]
    metrics:
      receivers: [otlp, docker_stats]
      processors: [resource/docker_metrics, batch]
      exporters: [otlp_grpc/doctor]